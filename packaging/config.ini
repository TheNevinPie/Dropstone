# Dropstone deployment configuration.
# Place this file next to Dropstone.exe to prefill the installer.
# Values are only defaults: the user still confirms the install.

# Installation folder. Environment variables are expanded.
installdir=%LOCALAPPDATA%\Dropstone

# Optional: skip automatic detection by setting the launcher paths.
# Relative paths are resolved against this file's folder.
#launcherexe=C:\path\to\LeviLauncher.exe
#versionsdir=C:\path\to\levilauncher\versions

# Payload mode: ask, local, or url.
payloadmode=ask

# Used when payloadmode=local. Relative paths are resolved against this file.
#payloadpath=payload.zip

# Used when payloadmode=url. Must be an absolute http or https URL.
#payloadurl=https://example.com/payload.zip
