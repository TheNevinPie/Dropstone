# Dropstone deployment configuration.
# Place this file next to Dropstone.exe to prefill the installer.
# When installdir and a payload are both set, Dropstone opens a one-click
# install screen instead of the setup wizard.

# Installation folder. Environment variables are expanded.
installdir=%LOCALAPPDATA%\Dropstone

# Optional: skip automatic detection by setting the launcher paths.
# Relative paths are resolved against this file's folder.
#launcherexe=C:\path\to\LeviLauncher.exe
#versionsdir=C:\path\to\levilauncher\versions

# Payload mode: ask, local, dll, or url.
payloadmode=ask

# Used when payloadmode=local or dll. Relative paths are resolved against this file.
#payloadpath=payload.zip

# Used when payloadmode=url. Must be an absolute http or https URL.
#payloadurl=https://example.com/payload.zip

# One-click install text (optional). Only used when installdir and a payload
# are both set, as described above.
# Heading and description on the one-click install screen.
#title=One-click install
#description=The install folder and payload are preset. Review them, then install.
# Heading and description on the installed screen afterwards. They are saved
# into the install folder and shown on every later launch.
#installedtitle=Dropstone is already installed
#installeddescription=Your payload is deployed and stays in sync.
