name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run worker tests
        shell: powershell
        run: .\tests\Run-Tests.ps1 -Quick
      - name: Build release
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Dropstone-win-x64
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
